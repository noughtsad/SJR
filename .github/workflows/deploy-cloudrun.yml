name: deploy-cloudrun

# Rebuilds and redeploys the API on Google Cloud Run when API code changes on main.
# Service settings (memory, secrets, env vars) are set once at the first deploy (DEPLOY.md)
# and persist; this workflow only ships new code.
# Needs GitHub secrets: GCP_SA_KEY (deployer service-account JSON key), GCP_PROJECT.
on:
  push:
    branches: [main]
    paths: ["app/**", "db/**", "requirements.txt", "Dockerfile", ".github/workflows/deploy-cloudrun.yml"]
  workflow_dispatch:

env:
  REGION: asia-northeast1   # same metro as the Supabase project (AWS ap-northeast-1)
  SERVICE: sjr-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::notice::GCP_SA_KEY not set; skipping deploy (see DEPLOY.md)"; echo "ok=false" >> "$GITHUB_OUTPUT";
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: steps.cfg.outputs.ok == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Build (Cloud Build) and deploy
        if: steps.cfg.outputs.ok == 'true'
        run: |
          gcloud run deploy "$SERVICE" --source . --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT }}" --quiet
          echo "URL: $(gcloud run services describe "$SERVICE" --region "$REGION" --project "${{ secrets.GCP_PROJECT }}" --format='value(status.url)')"
