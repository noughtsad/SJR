name: refresh-index

# Pulls fresh jobs, upserts changes, expires delisted postings, and embeds
# only new/changed rows. Needs a DATABASE_URL secret pointing at a reachable
# Postgres (your deployed DB, or Supabase).
on:
  schedule:
    - cron: "17 */8 * * *"   # 3x/day, within Remotive's fair-use guidance
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEVICE: cpu
    steps:
      # Until the hosted DB is set up (DEPLOY.md), skip instead of failing 3x a day.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::DATABASE_URL secret not set; skipping refresh"; echo "ok=false" >> "$GITHUB_OUTPUT";
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache HF models
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/embeddings/registry.py') }}
      - if: steps.cfg.outputs.ok == 'true'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - if: steps.cfg.outputs.ok == 'true'
        run: python -m app.cli init-db && python -m app.cli refresh
